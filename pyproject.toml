[project]
name = "game-recommend-be"
version = "0.1.0"
description = "자연어로 말한 조건에 맞춰 게임을 추천하는 FastAPI 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx2>=2.12",
    "openai>=3.13",
    # 에이전트 계층(app/agent/): create_agent 루프·Tool 정의·구조화 출력. langgraph는 langchain이 끌어온다
    "langchain>=1.4",
    "langchain-openai>=1.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # app/__init__.py가 load_dotenv()로 .env를 os.environ에 올린다(steam_reviews.py, LangSmith 추적)
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
