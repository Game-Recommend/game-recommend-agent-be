[project]
name = "game-recommend-be"
version = "0.1.0"
description = "자연어로 말한 조건에 맞춰 게임을 추천하는 FastAPI 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx2>=2.12",
    "openai>=3.13",
    # 에이전트 계층(app/agent/): create_agent 루프·Tool 정의·구조화 출력. langgraph는 langchain이 끌어온다
    "langchain>=1.4",
    "langchain-openai>=1.6",
    # OpenAI SDK를 직접 부르는 지점(질문 파서·리뷰 요약·사양 판정)을 wrap_openai로 감싼다.
    # langchain이 이미 끌어오지만 app이 직접 import하므로 명시한다
    "langsmith>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # app/__init__.py가 load_dotenv()로 .env를 os.environ에 올린다(steam_reviews.py, LangSmith 추적)
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
# evals/*/test_*.py는 모의 응답과 저장된 데이터만 쓰는 오프라인 검사라 본 테스트와 함께 돈다.
# 실제 API와 LLM을 부르는 쪽(run_eval.py·judge.py·build_dataset.py)은 테스트가 아니라 스크립트라
# 수집되지 않는다. 평가 쪽에 느리거나 돈이 드는 테스트를 새로 만들면 마커로 분리한다.
testpaths = ["tests", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
