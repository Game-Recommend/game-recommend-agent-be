<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1700" viewBox="0 0 2560 1700" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, sans-serif">
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<marker id="arr_s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
</defs>
<rect width="2560" height="1700" fill="#F5F6FA"/>
<text x="56" y="118" font-size="56" fill="#111827" font-weight="700">Game recommendation agent prompt architecture</text>
<text x="56" y="170" font-size="26" fill="#6B7280">The prompts one query passes through, and the prompts used to fix them  &#8212;  4 runtime &#183; 2 assembly &#183; 1 evaluation</text>
<rect x="2308" y="128" width="196" height="40" rx="20" fill="white" stroke="#D1D5DB"/>
<circle cx="2330" cy="148" r="8" fill="#334155"/>
<text x="2348" y="156" font-size="22" fill="#111827">Code enforces</text>
<rect x="2062" y="128" width="232" height="40" rx="20" fill="white" stroke="#D1D5DB"/>
<circle cx="2084" cy="148" r="8" fill="#D97706"/>
<text x="2102" y="156" font-size="22" fill="#111827">Evaluation &#183; offline</text>
<rect x="1852" y="128" width="196" height="40" rx="20" fill="white" stroke="#D1D5DB"/>
<circle cx="1874" cy="148" r="8" fill="#6D5DF6"/>
<text x="1892" y="156" font-size="22" fill="#111827">Direct LLM call</text>
<rect x="1597" y="128" width="241" height="40" rx="20" fill="white" stroke="#D1D5DB"/>
<circle cx="1619" cy="148" r="8" fill="#0E9F9F"/>
<text x="1637" y="156" font-size="22" fill="#111827">AGENT (LangChain)</text>
<text x="56" y="238" font-size="24" fill="#334155" font-weight="700">Runtime path &#8212; the prompts a query passes through, and the prompts code assembles</text>
<rect x="56" y="270" width="360" height="600" rx="24" fill="white" filter="url(#sh)"/>
<rect x="56" y="270" width="360" height="10" rx="5" fill="#6D5DF6"/>
<circle cx="102" cy="332" r="24" fill="#6D5DF6"/>
<text x="102" y="341" font-size="24" fill="white" font-weight="700" text-anchor="middle">1</text>
<rect x="320" y="314" width="68" height="36" rx="18" fill="#6D5DF6" fill-opacity="0.12"/>
<text x="354.0" y="339" font-size="20" fill="#6D5DF6" font-weight="600" text-anchor="middle">LLM</text>
<circle cx="236.0" cy="420" r="44" fill="#6D5DF6" fill-opacity="0.10"/>
<path d="M214.0 420 h16 M230.0 420 L244.0 404 M230.0 420 h14 M230.0 420 L244.0 436" fill="none" stroke="#6D5DF6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250.0" cy="404" r="6" fill="#6D5DF6"/><circle cx="250.0" cy="420" r="6" fill="#6D5DF6"/><circle cx="250.0" cy="436" r="6" fill="#6D5DF6"/>
<text x="236.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">Query parsing</text>
<text x="84" y="570" font-size="21" fill="#111827" font-weight="600">QUERY_PARSER_SYSTEM</text>
<text x="84" y="600" font-size="19" fill="#6B7280">preamble + 6 sections + output rules</text>
<text x="84" y="630" font-size="19" fill="#6B7280">free text &#8594; GameConditions</text>
<text x="84" y="682" font-size="21" fill="#111827" font-weight="600">response_format</text>
<text x="84" y="712" font-size="19" fill="#6B7280">parsed into a Pydantic model</text>
<text x="84" y="742" font-size="19" fill="#6B7280">no recommending, no searching</text>
<line x1="84" y1="762" x2="388" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="84" y="796" font-size="19" fill="#6D5DF6" font-weight="600">QueryParser</text>
<text x="84" y="826" font-size="18" fill="#6B7280">conditions with a dedicated</text>
<text x="84" y="854" font-size="18" fill="#6B7280">field never go in preferences</text>
<line x1="420" y1="420" x2="469" y2="420" stroke="#94A3B8" stroke-width="3.5" marker-end="url(#arr)"/>
<rect x="473" y="270" width="360" height="600" rx="24" fill="white" filter="url(#sh)"/>
<rect x="473" y="270" width="360" height="10" rx="5" fill="#334155"/>
<circle cx="519" cy="332" r="24" fill="#334155"/>
<text x="519" y="341" font-size="24" fill="white" font-weight="700" text-anchor="middle">2</text>
<rect x="724" y="314" width="81" height="36" rx="18" fill="#334155" fill-opacity="0.12"/>
<text x="764.5" y="339" font-size="20" fill="#334155" font-weight="600" text-anchor="middle">CODE</text>
<circle cx="653.0" cy="420" r="44" fill="#334155" fill-opacity="0.10"/>
<rect x="631.0" y="398" width="44" height="11" rx="4" fill="none" stroke="#334155" stroke-width="3.5"/>
<rect x="631.0" y="415" width="30" height="11" rx="4" fill="none" stroke="#334155" stroke-width="3.5"/>
<rect x="631.0" y="432" width="38" height="11" rx="4" fill="none" stroke="#334155" stroke-width="3.5"/>
<text x="653.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">Instruction assembly</text>
<text x="501" y="570" font-size="21" fill="#111827" font-weight="600">build_user_input</text>
<text x="501" y="600" font-size="19" fill="#6B7280">question &#183; conditions &#183; search JSON</text>
<text x="501" y="630" font-size="19" fill="#6B7280">split into three blocks</text>
<text x="501" y="682" font-size="21" fill="#111827" font-weight="600">5 conditional branches</text>
<text x="501" y="712" font-size="19" fill="#6B7280">free &#183; no budget &#183; prefers free</text>
<text x="501" y="742" font-size="19" fill="#6B7280">review criteria &#183; companions</text>
<line x1="501" y1="762" x2="805" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="501" y="796" font-size="19" fill="#334155" font-weight="600">differs per request</text>
<text x="501" y="826" font-size="18" fill="#6B7280">not fixed wording &#8212; computed</text>
<text x="501" y="854" font-size="18" fill="#6B7280">from the conditions each time</text>
<line x1="837" y1="420" x2="886" y2="420" stroke="#94A3B8" stroke-width="3.5" marker-end="url(#arr)"/>
<rect x="890" y="270" width="360" height="600" rx="24" fill="white" filter="url(#sh)"/>
<rect x="890" y="270" width="360" height="10" rx="5" fill="#0E9F9F"/>
<circle cx="936" cy="332" r="24" fill="#0E9F9F"/>
<text x="936" y="341" font-size="24" fill="white" font-weight="700" text-anchor="middle">3</text>
<rect x="1127" y="314" width="95" height="36" rx="18" fill="#0E9F9F" fill-opacity="0.12"/>
<text x="1174.5" y="339" font-size="20" fill="#0E9F9F" font-weight="600" text-anchor="middle">AGENT</text>
<circle cx="1070.0" cy="420" r="44" fill="#0E9F9F" fill-opacity="0.10"/>
<path d="M1079.0 404.4 A 18 18 0 1 1 1054.4 411.0" fill="none" stroke="#0E9F9F" stroke-width="3.5" stroke-linecap="round"/>
<path d="M1059.4 402.3 L1058.5 416.8 L1047.3 410.3 z" fill="#0E9F9F"/>
<text x="1070.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">Agent loop</text>
<text x="918" y="570" font-size="21" fill="#111827" font-weight="600">AGENT_SYSTEM &#183; 6 blocks</text>
<text x="918" y="600" font-size="19" fill="#6B7280">trust boundary &#183; tool selection</text>
<text x="918" y="630" font-size="19" fill="#6B7280">dedup &#183; writing &#183; failure &#183; refusal</text>
<text x="918" y="682" font-size="21" fill="#111827" font-weight="600">ToolStrategy</text>
<text x="918" y="712" font-size="19" fill="#6B7280">ends only via RecommendationDraft</text>
<line x1="918" y1="762" x2="1222" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="918" y="796" font-size="19" fill="#0E9F9F" font-weight="600">create_agent</text>
<text x="918" y="826" font-size="18" fill="#6B7280">the final output arrives as a</text>
<text x="918" y="854" font-size="18" fill="#6B7280">tool call, not free text</text>
<line x1="1254" y1="420" x2="1303" y2="420" stroke="#94A3B8" stroke-width="3.5" marker-end="url(#arr)"/>
<rect x="1307" y="270" width="360" height="600" rx="24" fill="white" filter="url(#sh)"/>
<rect x="1307" y="270" width="360" height="10" rx="5" fill="#6D5DF6"/>
<circle cx="1353" cy="332" r="24" fill="#6D5DF6"/>
<text x="1353" y="341" font-size="24" fill="white" font-weight="700" text-anchor="middle">4</text>
<rect x="1571" y="314" width="68" height="36" rx="18" fill="#6D5DF6" fill-opacity="0.12"/>
<text x="1605.0" y="339" font-size="20" fill="#6D5DF6" font-weight="600" text-anchor="middle">LLM</text>
<circle cx="1487.0" cy="420" r="44" fill="#6D5DF6" fill-opacity="0.10"/>
<rect x="1471.0" y="404" width="32" height="32" rx="5" fill="none" stroke="#6D5DF6" stroke-width="3.5"/><rect x="1481.0" y="414" width="12" height="12" rx="3" fill="none" stroke="#6D5DF6" stroke-width="3.5"/>
<path d="M1479.0 404 v-8 M1479.0 436 v8 M1471.0 412 h-8 M1503.0 412 h8 M1487.0 404 v-8 M1487.0 436 v8 M1471.0 420 h-8 M1503.0 420 h8 M1495.0 404 v-8 M1495.0 436 v8 M1471.0 428 h-8 M1503.0 428 h8" fill="none" stroke="#6D5DF6" stroke-width="3.5" stroke-linecap="round"/>
<text x="1487.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">Spec verdict</text>
<text x="1335" y="570" font-size="21" fill="#111827" font-weight="600">SpecJudge</text>
<text x="1335" y="600" font-size="19" fill="#6B7280">met &#183; unmet &#183; unknown per part</text>
<text x="1335" y="630" font-size="19" fill="#6B7280">one 30-character rationale</text>
<text x="1335" y="682" font-size="21" fill="#111827" font-weight="600">compose_assessment</text>
<text x="1335" y="712" font-size="19" fill="#6B7280">final verdict and reason: code</text>
<line x1="1335" y1="762" x2="1639" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="1335" y="796" font-size="19" fill="#6D5DF6" font-weight="600">learned in v1</text>
<text x="1335" y="826" font-size="18" fill="#6B7280">given the sentence, it passed on</text>
<text x="1335" y="854" font-size="18" fill="#6B7280">GPU alone and copied part names</text>
<line x1="1671" y1="420" x2="1720" y2="420" stroke="#94A3B8" stroke-width="3.5" marker-end="url(#arr)"/>
<rect x="1724" y="270" width="360" height="600" rx="24" fill="white" filter="url(#sh)"/>
<rect x="1724" y="270" width="360" height="10" rx="5" fill="#6D5DF6"/>
<circle cx="1770" cy="332" r="24" fill="#6D5DF6"/>
<text x="1770" y="341" font-size="24" fill="white" font-weight="700" text-anchor="middle">5</text>
<rect x="1988" y="314" width="68" height="36" rx="18" fill="#6D5DF6" fill-opacity="0.12"/>
<text x="2022.0" y="339" font-size="20" fill="#6D5DF6" font-weight="600" text-anchor="middle">LLM</text>
<circle cx="1904.0" cy="420" r="44" fill="#6D5DF6" fill-opacity="0.10"/>
<rect x="1882.0" y="400" width="44" height="32" rx="8" fill="none" stroke="#6D5DF6" stroke-width="3.5"/><path d="M1894.0 432 v10 l13 -10" fill="none" stroke="#6D5DF6" stroke-width="3.5" stroke-linejoin="round"/><path d="M1892.0 411 h24 M1892.0 421 h15" fill="none" stroke="#6D5DF6" stroke-width="3.5" stroke-linecap="round"/>
<text x="1904.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">Review blurb</text>
<text x="1752" y="570" font-size="21" fill="#111827" font-weight="600">ReviewSummary</text>
<text x="1752" y="600" font-size="19" fill="#6B7280">top 20 Steam reviews by votes</text>
<text x="1752" y="630" font-size="19" fill="#6B7280">each trimmed to 1,000 chars</text>
<text x="1752" y="682" font-size="21" fill="#111827" font-weight="600">Repeated signals first</text>
<text x="1752" y="712" font-size="19" fill="#6B7280">one-off opinions are dropped</text>
<line x1="1752" y1="762" x2="2056" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="1752" y="796" font-size="19" fill="#6D5DF6" font-weight="600">No invented elements</text>
<text x="1752" y="826" font-size="18" fill="#6B7280">no filler about combat or</text>
<text x="1752" y="854" font-size="18" fill="#6B7280">exploration, so genres generalise</text>
<line x1="2088" y1="420" x2="2137" y2="420" stroke="#94A3B8" stroke-width="3.5" marker-end="url(#arr)"/>
<rect x="2141" y="270" width="360" height="600" rx="24" fill="white" filter="url(#sh)"/>
<rect x="2141" y="270" width="360" height="10" rx="5" fill="#334155"/>
<circle cx="2187" cy="332" r="24" fill="#334155"/>
<text x="2187" y="341" font-size="24" fill="white" font-weight="700" text-anchor="middle">6</text>
<rect x="2392" y="314" width="81" height="36" rx="18" fill="#334155" fill-opacity="0.12"/>
<text x="2432.5" y="339" font-size="20" fill="#334155" font-weight="600" text-anchor="middle">CODE</text>
<circle cx="2321.0" cy="420" r="44" fill="#334155" fill-opacity="0.10"/>
<path d="M2321.0 398 l18 8 v12 c0 12 -8 20 -18 24 c-10 -4 -18 -12 -18 -24 v-12 z" fill="none" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/><path d="M2313.0 420 l6 6 l11 -13" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="2321.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">Validation &#183; refusal</text>
<text x="2169" y="570" font-size="21" fill="#111827" font-weight="600">validate_draft</text>
<text x="2169" y="600" font-size="19" fill="#6B7280">ids outside the pool &#183; over count</text>
<text x="2169" y="630" font-size="19" fill="#6B7280">catches unmet &#183; unknown picks</text>
<text x="2169" y="682" font-size="21" fill="#111827" font-weight="600">build_rejection</text>
<text x="2169" y="712" font-size="19" fill="#6B7280">one retry with the problem list</text>
<line x1="2169" y1="762" x2="2473" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="2169" y="796" font-size="19" fill="#334155" font-weight="600">still failing &#8594; 502</text>
<text x="2169" y="826" font-size="18" fill="#6B7280">it chooses not to recommend</text>
<text x="2169" y="854" font-size="18" fill="#6B7280">and warns on an empty result</text>
<text x="56" y="922" font-size="24" fill="#334155" font-weight="700">Offline &#8212; the prompts that score prompts, and what prompts alone could not fix</text>
<rect x="56" y="950" width="1500" height="400" rx="24" fill="white" filter="url(#sh)"/>
<rect x="56" y="950" width="1500" height="10" rx="5" fill="#D97706"/>
<text x="92" y="1016" font-size="28" fill="#111827" font-weight="700">Prompts that evaluate</text>
<text x="92" y="1052" font-size="20" fill="#6B7280">The judge stands apart from the generator &#8212; code counts what code can count, the LLM judge looks only at the remaining two</text>
<text x="92" y="1116" font-size="21" fill="#D97706" font-weight="600">Answer judge &#183; AnswerJudge</text>
<text x="92" y="1150" font-size="19" fill="#6B7280">scores the answer against evidence</text>
<text x="92" y="1180" font-size="19" fill="#6B7280">grounded &#8212; claims beyond evidence</text>
<text x="92" y="1210" font-size="19" fill="#6B7280">linked &#8212; conditions tied to reasons</text>
<text x="92" y="1240" font-size="19" fill="#6B7280">1&#8211;5 plus a one-sentence reason</text>
<line x1="544" y1="1080" x2="544" y2="1254" stroke="#D1D5DB" stroke-width="2"/>
<text x="568" y="1116" font-size="21" fill="#D97706" font-weight="600">3 code-scored axes &#183; E2E</text>
<text x="568" y="1150" font-size="19" fill="#6B7280">constraints &#8212; hard conditions met</text>
<text x="568" y="1180" font-size="19" fill="#6B7280">trajectory &#8212; stages run and order</text>
<text x="568" y="1210" font-size="19" fill="#6B7280">answer_format &#8212; paragraph form</text>
<text x="568" y="1240" font-size="19" fill="#6B7280">there is no gold answer list</text>
<line x1="1020" y1="1080" x2="1020" y2="1254" stroke="#D1D5DB" stroke-width="2"/>
<text x="1044" y="1116" font-size="21" fill="#D97706" font-weight="600">6 eval sets &#183; 580 items</text>
<text x="1044" y="1150" font-size="19" fill="#6B7280">parser 210 &#183; E2E 100 &#183; price/spec 50</text>
<text x="1044" y="1180" font-size="19" fill="#6B7280">non-Steam 40 &#183; taste fit 40 &#183; search pool 140</text>
<text x="1044" y="1210" font-size="19" fill="#6B7280">written and labelled by hand &#183; search pool derived</text>
<text x="1044" y="1240" font-size="19" fill="#6B7280">LangSmith experiments: parser only &#183; records in runs/</text>
<line x1="92" y1="1276" x2="1520" y2="1276" stroke="#D1D5DB" stroke-width="2"/>
<text x="92" y="1312" font-size="19" fill="#111827" font-weight="600">Judges err too &#8212; these scores lean on a prompt, so they are reported separately from the code-scored axes</text>
<rect x="1604" y="950" width="900" height="400" rx="24" fill="white" filter="url(#sh)"/>
<rect x="1604" y="950" width="900" height="10" rx="5" fill="#334155"/>
<text x="1640" y="1016" font-size="28" fill="#111827" font-weight="700">Prompts that measurement rolled back</text>
<text x="1640" y="1052" font-size="20" fill="#6B7280">Rules written out with examples broke anyway in the field</text>
<text x="1640" y="1116" font-size="21" fill="#334155" font-weight="600">Written in the prompt, not followed</text>
<text x="1640" y="1150" font-size="19" fill="#6B7280">&#8216;with N friends&#8217; &#8594; N+1  18/18 failed</text>
<text x="1640" y="1180" font-size="19" fill="#6B7280">&#8216;integrated graphics&#8217; in the gpu field</text>
<text x="1640" y="1210" font-size="19" fill="#6B7280">soft dislike of turn-based &#8594; hard filter</text>
<text x="1640" y="1240" font-size="19" fill="#6B7280">cannot judge &#8594; ruled unmet 16/26</text>
<line x1="1640" y1="1276" x2="2468" y2="1276" stroke="#D1D5DB" stroke-width="2"/>
<text x="1640" y="1312" font-size="19" fill="#111827" font-weight="600">Measurement pointed at the code safety nets and contracts to fix, instead of more wording</text>
<path d="M1700 940 V 928 H 1487 V 878" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr_s)"/>
<text x="1512" y="918" font-size="19" fill="#334155" font-weight="600">verdict sentence moved back into code</text>
<text x="56" y="1392" font-size="24" fill="#334155" font-weight="700">What makes a prompt a contract, not a document</text>
<rect x="56" y="1420" width="800" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="56" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="82" y="1472" font-size="23" fill="#111827" font-weight="700">The output is a schema</text>
<text x="82" y="1520" font-size="19" fill="#6B7280">GameConditions &#183; RecommendationDraft &#183; _JudgeOutput &#8212;</text>
<text x="82" y="1552" font-size="19" fill="#6B7280">three of the four prompts are parsed into Pydantic models.</text>
<text x="82" y="1584" font-size="19" fill="#6B7280">Format violations end at parsing; only content rules remain.</text>
<rect x="880" y="1420" width="800" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="880" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="906" y="1472" font-size="23" fill="#111827" font-weight="700">Enforcement lives outside the prompt</text>
<text x="906" y="1520" font-size="19" fill="#6B7280">Recommendation count and verdict checks are enforced by validate_draft,</text>
<text x="906" y="1552" font-size="19" fill="#6B7280">condition de-duplication by the validator in conditions.py, and the final</text>
<text x="906" y="1584" font-size="19" fill="#6B7280">spec verdict by compose_assessment. Prompts ask; code refuses.</text>
<rect x="1704" y="1420" width="800" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="1704" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="1730" y="1472" font-size="23" fill="#111827" font-weight="700">Names survive in the trace</text>
<text x="1730" y="1520" font-size="19" fill="#6B7280">QueryParser &#183; SpecJudge &#183; ReviewSummary &#183; AnswerJudge are</text>
<text x="1730" y="1552" font-size="19" fill="#6B7280">wrapped with wrap_openai and become LangSmith child runs.</text>
<text x="1730" y="1584" font-size="19" fill="#6B7280">One trace shows which prompt produced what.</text>
</svg>
