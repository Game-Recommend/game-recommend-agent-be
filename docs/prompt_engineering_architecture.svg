<text x="1904.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">리뷰 한줄평</text>
<text x="1752" y="570" font-size="21" fill="#111827" font-weight="600">ReviewSummary</text>
<text x="1752" y="600" font-size="19" fill="#6B7280">Steam · 웹 리뷰 상위 20개</text>
<text x="1752" y="630" font-size="19" fill="#6B7280">리뷰당 1000자로 잘라 투입</text>
<text x="1752" y="682" font-size="21" fill="#111827" font-weight="600">반복 신호 우선</text>
<text x="1752" y="712" font-size="19" fill="#6B7280">한두 건의 의견은 쓰지 않는다</text>
<line x1="1752" y1="762" x2="2056" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="1752" y="796" font-size="19" fill="#6D5DF6" font-weight="600">억지 요소 금지</text>
<text x="1752" y="826" font-size="18" fill="#6B7280">전투 · 탐험을 채워 넣지 않아</text>
<text x="1752" y="854" font-size="18" fill="#6B7280">장르가 달라도 일반화된다</text>
<line x1="2088" y1="420" x2="2137" y2="420" stroke="#94A3B8" stroke-width="3.5" marker-end="url(#arr)"/>
