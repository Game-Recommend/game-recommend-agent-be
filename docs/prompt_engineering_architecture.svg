<text x="2321.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">후검증 · 거부</text>
<text x="2169" y="570" font-size="21" fill="#111827" font-weight="600">validate_draft</text>
<text x="2169" y="600" font-size="19" fill="#6B7280">후보 밖 id · 개수 초과</text>
<text x="2169" y="630" font-size="19" fill="#6B7280">unmet · unknown 추천을 잡는다</text>
<text x="2169" y="682" font-size="21" fill="#111827" font-weight="600">build_rejection</text>
<text x="2169" y="712" font-size="19" fill="#6B7280">문제 목록을 붙여 재호출 1회</text>
<line x1="2169" y1="762" x2="2473" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="2169" y="796" font-size="19" fill="#334155" font-weight="600">그래도 남으면 502</text>
<text x="2169" y="826" font-size="18" fill="#6B7280">추천하지 않는 쪽을 택한다</text>
<text x="2169" y="854" font-size="18" fill="#6B7280">빈 추천에는 경고를 남긴다</text>
<text x="56" y="922" font-size="24" fill="#334155" font-weight="700">오프라인 — 프롬프트를 채점하는 프롬프트, 그리고 프롬프트만으로는 안 된 것</text>
<rect x="56" y="950" width="1500" height="400" rx="24" fill="white" filter="url(#sh)"/>
<rect x="56" y="950" width="1500" height="10" rx="5" fill="#D97706"/>
<text x="92" y="1016" font-size="28" fill="#111827" font-weight="700">평가하는 프롬프트</text>
<text x="92" y="1052" font-size="20" fill="#6B7280">심판은 생성기와 따로 선다 — 코드로 셀 수 있는 것은 코드가 세고, LLM 심판은 남은 두 가지만 본다</text>
<text x="92" y="1116" font-size="21" fill="#D97706" font-weight="600">답변 심판 · AnswerJudge</text>
<text x="92" y="1150" font-size="19" fill="#6B7280">답변을 근거와 대조해 채점한다</text>
<text x="92" y="1180" font-size="19" fill="#6B7280">grounded — 근거 밖 수치 · 단정</text>
<text x="92" y="1210" font-size="19" fill="#6B7280">linked — 조건과 이유의 연결</text>
<text x="92" y="1240" font-size="19" fill="#6B7280">1~5점과 사유 한 문장</text>
<line x1="544" y1="1080" x2="544" y2="1254" stroke="#D1D5DB" stroke-width="2"/>
<text x="568" y="1116" font-size="21" fill="#D97706" font-weight="600">코드 채점 3축 · E2E</text>
<text x="568" y="1150" font-size="19" fill="#6B7280">constraints — 필수 조건 준수</text>
<text x="568" y="1180" font-size="19" fill="#6B7280">trajectory — 단계 실행과 순서</text>
<text x="568" y="1210" font-size="19" fill="#6B7280">answer_format — 문단 형식</text>
<text x="568" y="1240" font-size="19" fill="#6B7280">정답 추천 목록은 없다</text>
<line x1="1020" y1="1080" x2="1020" y2="1254" stroke="#D1D5DB" stroke-width="2"/>
<text x="1044" y="1116" font-size="21" fill="#D97706" font-weight="600">평가셋 4종 · 390문항</text>
<text x="1044" y="1150" font-size="19" fill="#6B7280">파서 조건 200 · E2E 100</text>
<text x="1044" y="1180" font-size="19" fill="#6B7280">가격 · 사양 50 · 비Steam 40</text>
<text x="1044" y="1210" font-size="19" fill="#6B7280">사람이 쓰고 라벨을 붙였다</text>
<text x="1044" y="1240" font-size="19" fill="#6B7280">LangSmith 실험으로 남는다</text>
<line x1="92" y1="1276" x2="1520" y2="1276" stroke="#D1D5DB" stroke-width="2"/>
<text x="92" y="1312" font-size="19" fill="#111827" font-weight="600">심판도 틀린다 — 프롬프트에 기댄 점수라 코드 자동 채점과 섞지 않고 따로 보고한다</text>
<rect x="1604" y="950" width="900" height="400" rx="24" fill="white" filter="url(#sh)"/>
<rect x="1604" y="950" width="900" height="10" rx="5" fill="#334155"/>
<text x="1640" y="1016" font-size="28" fill="#111827" font-weight="700">실측이 되돌린 프롬프트</text>
<text x="1640" y="1052" font-size="20" fill="#6B7280">예시까지 적어 둔 규칙이 실측에서 그대로 깨졌다</text>
<text x="1640" y="1116" font-size="21" fill="#334155" font-weight="600">프롬프트에 썼는데 지켜지지 않았다</text>
<text x="1640" y="1150" font-size="19" fill="#6B7280">친구 N명이서 → N+1  18/18 실패</text>
<text x="1640" y="1180" font-size="19" fill="#6B7280">내장그래픽을 gpu 모델명 자리에</text>
<text x="1640" y="1210" font-size="19" fill="#6B7280">턴제 소프트 불호 → 하드 필터</text>
<text x="1640" y="1240" font-size="19" fill="#6B7280">판단 불가 → 미달 단정 16/26</text>
<line x1="1640" y1="1276" x2="2468" y2="1276" stroke="#D1D5DB" stroke-width="2"/>
<text x="1640" y="1312" font-size="19" fill="#111827" font-weight="600">문구를 더 붙이는 대신 코드 안전망과 계약을 고칠 자리를 실측이 짚었다</text>
<path d="M1700 940 V 928 H 1487 V 878" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr_s)"/>
<text x="1512" y="918" font-size="19" fill="#334155" font-weight="600">판정 문장을 코드로 되돌렸다</text>
<text x="56" y="1392" font-size="24" fill="#334155" font-weight="700">프롬프트를 문서가 아니라 계약으로 만드는 축</text>
<rect x="56" y="1420" width="800" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="56" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="82" y="1472" font-size="23" fill="#111827" font-weight="700">출력이 스키마다</text>
<text x="82" y="1520" font-size="19" fill="#6B7280">GameConditions · RecommendationDraft · _JudgeOutput —</text>
<text x="82" y="1552" font-size="19" fill="#6B7280">네 프롬프트 중 셋을 Pydantic 모델로 파싱해 받는다.</text>
<text x="82" y="1584" font-size="19" fill="#6B7280">형식 위반은 파싱에서 끝나고 본문 규칙만 남는다.</text>
<rect x="880" y="1420" width="800" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="880" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="906" y="1472" font-size="23" fill="#111827" font-weight="700">집행은 프롬프트 밖에 둔다</text>
<text x="906" y="1520" font-size="19" fill="#6B7280">추천 개수와 판정 통과는 validate_draft가, 조건 중복 제거는</text>
<text x="906" y="1552" font-size="19" fill="#6B7280">conditions.py의 validator가, 사양 최종 판정은 compose_assessment가</text>
<text x="906" y="1584" font-size="19" fill="#6B7280">집행한다. 프롬프트는 요청하고, 거부는 코드가 한다.</text>
<rect x="1704" y="1420" width="800" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="1704" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="1730" y="1472" font-size="23" fill="#111827" font-weight="700">트레이스에 이름이 남는다</text>
<text x="1730" y="1520" font-size="19" fill="#6B7280">QueryParser · SpecJudge · ReviewSummary · AnswerJudge가</text>
<text x="1730" y="1552" font-size="19" fill="#6B7280">wrap_openai로 감싸져 LangSmith 자식 run으로 남는다.</text>
<text x="1730" y="1584" font-size="19" fill="#6B7280">어느 프롬프트가 무엇을 냈는지 한 트레이스에서 읽힌다.</text>
</svg>
