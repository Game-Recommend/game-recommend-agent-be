<text x="1487.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">사양 판정</text>
<text x="1335" y="570" font-size="21" fill="#111827" font-weight="600">SpecJudge</text>
<text x="1335" y="600" font-size="19" fill="#6B7280">부품별 met · unmet · unknown</text>
<text x="1335" y="630" font-size="19" fill="#6B7280">30자 근거 한 구절만</text>
<text x="1335" y="682" font-size="21" fill="#111827" font-weight="600">compose_assessment</text>
<text x="1335" y="712" font-size="19" fill="#6B7280">전체 판정과 이유 문장은 코드</text>
<line x1="1335" y1="762" x2="1639" y2="762" stroke="#D1D5DB" stroke-width="2"/>
<text x="1335" y="796" font-size="19" fill="#6D5DF6" font-weight="600">v1에서 배운 것</text>
<text x="1335" y="826" font-size="18" fill="#6B7280">문장을 맡겼더니 GPU만 보고</text>
<text x="1335" y="854" font-size="18" fill="#6B7280">통과시키고 부품명을 베꼈다</text>
