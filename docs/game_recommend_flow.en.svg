<text x="92" y="976" font-size="23" fill="#111827" font-weight="700">Failure handling</text>
<text x="92" y="1012" font-size="19" fill="#6B7280">query parsing &#183; agent loop &#183; post-validation are required stages &#8212; a failure there is a 502  &#183;  a tool failure is returned to the LLM as error instead of raising, recorded in warnings, and the run continues</text>
